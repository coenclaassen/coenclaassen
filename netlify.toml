[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/dev/ducktapecalendar"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
  for = "/dev/ducktapecalendar/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

